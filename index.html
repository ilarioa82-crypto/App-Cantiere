<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Cantiere</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; margin: 0; }
        header { background: #333; color: #ffcc00; padding: 20px; text-align: center; }
        .modifica-ditta { font-size: 12px; color: #ccc; cursor: pointer; text-decoration: underline; }
        
        /* I due tasti grandi */
        .nav { display: flex; }
        .nav button { flex: 1; padding: 15px; border: none; background: #444; color: white; font-weight: bold; cursor: pointer; }
        .nav button.active { background: #ffcc00; color: #333; }

        .container { padding: 15px; }
        .sezione { display: none; }
        .sezione.active { display: block; }

        .scheda { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; position: relative; border-left: 5px solid #ffcc00; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .btn-invia { background: #ffcc00; color: #333; font-weight: bold; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; }
        .btn-excel { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; margin-top: 15px; cursor: pointer; }
        
        /* IL CESTINO */
        .btn-elimina { position: absolute; top: 10px; right: 10px; background: #ff4444; color: white; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
        
        .riga { margin: 5px 0; }
        .label { font-weight: bold; color: #666; }
    </style>
</head>
<body>

<header>
    <h1 id="nomeDitta">NOME DITTA</h1>
    <span class="modifica-ditta" onclick="cambiaDitta()">Modifica Nome</span>
</header>

<div class="nav">
    <button id="t1" class="active" onclick="switchTab('cantiere')">CANTIERI & PROGETTI</button>
    <button id="t2" onclick="switchTab('ore')">ORE & NOTE OPERAI</button>
</div>

<div class="container">
    
    <div id="sez-cantiere" class="sezione active">
        <div class="scheda">
            <h3>Nuovo Cantiere / Progetto</h3>
            <input type="text" id="c-nome" placeholder="Nome Cantiere">
            <input type="text" id="c-lavoro" placeholder="Lavoro svolto">
            <input type="text" id="c-progetto" placeholder="Link Progetto o Documento">
            <button class="btn-invia" onclick="salvaCantiere()">SALVA CANTIERE</button>
        </div>
        <div id="lista-cantiere"></div>
    </div>

    <div id="sez-ore" class="sezione">
        <div class="scheda">
            <h3>Registra Ore e Note</h3>
            <input type="text" id="o-nome" placeholder="Nome Operaio">
            <input type="number" id="o-ore" placeholder="Ore lavorate">
            <textarea id="o-note" placeholder="Note (cosa è stato fatto oggi)"></textarea>
            <input type="month" id="o-mese" value="2024-05">
            <button class="btn-invia" onclick="salvaOre()">REGISTRA ORE</button>
        </div>
        <button class="btn-excel" onclick="scaricaExcel()">📥 SCARICA EXCEL DEL MESE</button>
        <div id="lista-ore"></div>
    </div>

</div>

<script>
    // --- INCOLLA QUI LE TUE CHIAVI FIREBASE ---
    const firebaseConfig = {
        apiKey: "TUA_API_KEY",
        authDomain: "TUO_AUTH",
        projectId: "TUO_ID",
        storageBucket: "TUO_BUCKET",
        messagingSenderId: "TUO_SENDER",
        appId: "TUO_APP_ID"
    };
    // -----------------------------------------

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function switchTab(t) {
        document.querySelectorAll('.sezione').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        if(t === 'cantiere') {
            document.getElementById('sez-cantiere').classList.add('active');
            document.getElementById('t1').classList.add('active');
        } else {
            document.getElementById('sez-ore').classList.add('active');
            document.getElementById('t2').classList.add('active');
        }
    }

    function cambiaDitta() {
        let n = prompt("Nuovo nome ditta:");
        if(n) document.getElementById('nomeDitta').innerText = n.toUpperCase();
    }

    // --- CANTIERI ---
    function salvaCantiere() {
        const nome = document.getElementById('c-nome').value;
        const lavoro = document.getElementById('c-lavoro').value;
        const progetto = document.getElementById('c-progetto').value;
        if(nome) {
            db.collection("cantieri").add({ nome, lavoro, progetto, data: new Date() });
            document.getElementById('c-nome').value = '';
        }
    }

    db.collection("cantieri").orderBy("data", "desc").onSnapshot(s => {
        let html = "";
        s.forEach(doc => {
            let d = doc.data();
            html += `<div class="scheda">
                <button class="btn-elimina" onclick="elimina('${doc.id}', 'cantieri')">🗑️</button>
                <strong>${d.nome}</strong><br>
                <div class="riga">${d.lavoro}</div>
                ${d.progetto ? `<a href="${d.progetto}" target="_blank">📄 Vedi Progetto</a>` : ''}
            </div>`;
        });
        document.getElementById('lista-cantiere').innerHTML = html;
    });

    // --- ORE ---
    function salvaOre() {
        const nome = document.getElementById('o-nome').value;
        const ore = document.getElementById('o-ore').value;
        const note = document.getElementById('o-note').value;
        const mese = document.getElementById('o-mese').value;
        if(nome && ore) {
            db.collection("ore").add({ nome, ore, note, mese, data: new Date() });
            alert("Salvato!");
        }
    }

    db.collection("ore").orderBy("data", "desc").onSnapshot(s => {
        let html = "";
        s.forEach(doc => {
            let d = doc.data();
            html += `<div class="scheda">
                <button class="btn-elimina" onclick="elimina('${doc.id}', 'ore')">🗑️</button>
                <div class="riga"><span class="label">Operaio:</span> ${d.nome}</div>
                <div class="riga"><span class="label">Ore:</span> ${d.ore}</div>
                <div class="riga"><span class="label">Note:</span> ${d.note}</div>
                <div style="font-size:10px; color:gray">${d.mese}</div>
            </div>`;
        });
        document.getElementById('lista-ore').innerHTML = html;
    });

    // --- FUNZIONE ELIMINA ---
    function elimina(id, col) {
        if(confirm("Vuoi cancellare definitivamente?")) {
            db.collection(col).doc(id).delete();
        }
    }

    // --- EXCEL ---
    async function scaricaExcel() {
        const mese = document.getElementById('o-mese').value;
        const snap = await db.collection("ore").where("mese", "==", mese).get();
        let dati = [];
        snap.forEach(d => {
            let r = d.data();
            dati.push({ OPERAIO: r.nome, ORE: r.ore, NOTE: r.note, MESE: r.mese });
        });
        if(dati.length === 0) { alert("Nessun dato per questo mese"); return; }
        const ws = XLSX.utils.json_to_sheet(dati);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Report");
        XLSX.writeFile(wb, `Report_${mese}.xlsx`);
    }
</script>
</body>
</html>
