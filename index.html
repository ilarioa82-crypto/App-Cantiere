<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantiere Online Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; }
        h1 { color: #ffcc00; text-align: center; text-transform: uppercase; border-bottom: 2px solid #ffcc00; padding-bottom: 10px; }
        .card { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #ffcc00; position: relative; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #fff; color: #000; }
        button { background: #ffcc00; color: #000; font-weight: bold; cursor: pointer; }
        button:active { background: #e6b800; }
        .btn-delete { background: #ff4444; color: white; width: auto; padding: 5px 10px; margin-left: 10px; font-size: 12px; }
        .btn-edit { background: #4488ff; color: white; width: auto; padding: 5px 10px; font-size: 12px; }
        .actions { margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end; }
        .operaio-tag { font-size: 14px; color: #ffcc00; font-weight: bold; }
        .desc-tag { font-style: italic; color: #ccc; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🏗️ Gestione Cantieri</h1>

    <div style="background: #444; padding: 15px; border-radius: 10px; margin-bottom: 25px;">
        <h3 style="margin-top:0">Nuovo Inserimento</h3>
        <input type="text" id="nomeCantiere" placeholder="Nome Cantiere (es: Villa Rossi)">
        <input type="text" id="nomeOperaio" placeholder="Tuo Nome (Operaio)">
        <input type="number" id="oreLavoro" placeholder="Ore lavorate">
        <input type="text" id="descrizione" placeholder="Cosa hai fatto?">
        <button onclick="aggiungiDato()">Invia in Cloud 🚀</button>
    </div>

    <hr style="border: 0.5px solid #555">

    <div id="listaCantieri">
        <p style="text-align:center">Caricamento dati...</p>
    </div>

    <script>
        // --- INIZIO CONFIGURAZIONE FIREBASE ---
        // Sostituisci tutto questo blocco con le TUE chiavi che hai copiato da Firebase
        var firebaseConfig = {
            apiKey: "IL_TUO_API_KEY",
            authDomain: "IL_TUO_PROGETTO.firebaseapp.com",
            projectId: "IL_TUO_PROGETTO_ID",
            storageBucket: "IL_TUO_PROGETTO.appspot.com",
            messagingSenderId: "IL_TUO_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };
        // --- FINE CONFIGURAZIONE FIREBASE ---

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Leggi i dati in tempo reale
        db.collection("cantieri").orderBy("nomeCantiere").onSnapshot((snapshot) => {
            const lista = document.getElementById("listaCantieri");
            lista.innerHTML = "";
            
            if (snapshot.empty) {
                lista.innerHTML = "<p style='text-align:center'>Nessun cantiere registrato.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const d = doc.data();
                const id = doc.id;
                lista.innerHTML += `
                    <div class="card">
                        <strong style="font-size: 18px;">${d.nomeCantiere}</strong>
                        <span class="desc-tag">${d.descrizione || 'Nessuna descrizione'}</span>
                        <div style="margin-top:8px;">
                            <span class="operaio-tag">👤 ${d.nomeOperaio}</span> | 
                            <span>⏱️ ${d.oreLavoro} ore</span>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="modificaCantiere('${id}', '${d.nomeCantiere}')">✏️ Modifica</button>
                            <button class="btn-delete" onclick="eliminaCantiere('${id}')">🗑️ Elimina</button>
                        </div>
                    </div>
                `;
            });
        });

        // Aggiungi un nuovo cantiere
        async function aggiungiDato() {
            const nome = document.getElementById("nomeCantiere").value;
            const operaio = document.getElementById("nomeOperaio").value;
            const ore = document.getElementById("oreLavoro").value;
            const desc = document.getElementById("descrizione").value;

            if (nome && operaio && ore) {
                await db.collection("cantieri").add({
                    nomeCantiere: nome,
                    nomeOperaio: operaio,
                    oreLavoro: ore,
                    descrizione: desc,
                    data: new Date().toLocaleDateString()
                });
                // Pulisci i campi
                document.getElementById("nomeCantiere").value = "";
                document.getElementById("descrizione").value = "";
                alert("Dato salvato!");
            } else {
                alert("Per favore, compila almeno Nome Cantiere, Operaio e Ore.");
            }
        }

        // Elimina cantiere
        async function eliminaCantiere(id) {
            if (confirm("Vuoi davvero eliminare questo record?")) {
                await db.collection("cantieri").doc(id).delete();
            }
        }

        // Modifica nome cantiere
        async function modificaCantiere(id, vecchioNome) {
            const nuovoNome = prompt("Cambia nome cantiere:", vecchioNome);
            if (nuovoNome != null && nuovoNome != "") {
                await db.collection("cantieri").doc(id).update({
                    nomeCantiere: nuovoNome
                });
            }
        }
    </script>
</body>
</html>
