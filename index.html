<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Cantiere Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --azzurro: #007bff; --giallo: #ffcc00; --nero: #222; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        header { background: var(--azzurro); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--giallo); }
        .edit-ditta { font-size: 10px; color: var(--giallo); cursor: pointer; display: block; }
        
        .nav { display: flex; background: #333; }
        .nav button { flex: 1; padding: 15px; border: none; background: #333; color: var(--giallo); font-weight: bold; cursor: pointer; }
        .nav button.active { background: var(--giallo); color: black; }

        .container { padding: 15px; }
        .sezione { display: none; }
        .sezione.active { display: block; }

        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; position: relative; border-left: 6px solid var(--azzurro); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .btn-add { background: var(--giallo); border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-excel { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; margin-top: 10px; width: 100%; }
        
        .semaforo { display: inline-block; width: 15px; height: 15px; border-radius: 50%; margin-right: 5px; }
        .S-verde { background: #28a745; } .S-giallo { background: #ffc107; } .S-rosso { background: #dc3545; }
        
        .btn-delete { position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 18px; cursor: pointer; }
        .info-riga { font-size: 14px; margin: 3px 0; }
        .badge { background: #eee; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1 id="nomeDitta">LA TUA DITTA</h1>
    <span class="edit-ditta" onclick="cambiaDitta()">[Modifica Nome Ditta]</span>
</header>

<div class="nav">
    <button id="tabC" class="active" onclick="show('cantieri')">CANTIERI</button>
    <button id="tabO" onclick="show('operai')">OPERAI & BUSTE PAGA</button>
</div>

<div class="container">
    <div id="sez-cantieri" class="sezione active">
        <div class="card" style="border-left-color: var(--giallo);">
            <h3>Nuovo Cantiere</h3>
            <input type="text" id="c-nome" placeholder="Nome Cantiere (es. Villa Rossi)">
            <select id="c-stato">
                <option value="S-verde">🟢 In Corso / Attivo</option>
                <option value="S-giallo">🟡 In Attesa Materiali</option>
                <option value="S-rosso">🔴 Fermo / Chiuso</option>
            </select>
            <input type="text" id="c-doc" placeholder="Link Progetti / Documenti">
            <hr>
            <h4>Aggiungi Ore a questo cantiere:</h4>
            <input type="text" id="o-nome" placeholder="Nome Operaio">
            <input type="number" id="o-ore" placeholder="Ore lavorate">
            <textarea id="o-note" placeholder="Note (es. Intonaco esterno)"></textarea>
            <input type="month" id="o-mese" value="2024-05">
            <button class="btn-add" onclick="salvaTutto()">SALVA IN CANTIERE 🏗️</button>
        </div>
        <div id="lista-cantieri"></div>
    </div>

    <div id="sez-operai" class="sezione">
        <div class="card">
            <h3>Riepilogo Ore per Buste Paga</h3>
            <p>Seleziona il mese per scaricare il report Excel:</p>
            <input type="month" id="filtro-mese" value="2024-05">
            <button class="btn-excel" onclick="scaricaExcel()">📥 SCARICA REPORT EXCEL</button>
        </div>
        <div id="lista-riepilogo-operai"></div>
    </div>
</div>

<script>
    // INCOLLA LE TUE CHIAVI FIREBASE QUI
    const firebaseConfig = {
        apiKey: "TUA_API_KEY",
        authDomain: "TUO_PROGETTO.firebaseapp.com",
        projectId: "TUO_PROGETTO_ID",
        storageBucket: "TUO_PROGETTO.appspot.com",
        messagingSenderId: "TUO_SENDER",
        appId: "TUO_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function show(s) {
        document.querySelectorAll('.sezione').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
        if(s === 'cantieri') { document.getElementById('sez-cantieri').classList.add('active'); document.getElementById('tabC').classList.add('active'); }
        else { document.getElementById('sez-operai').classList.add('active'); document.getElementById('tabO').classList.add('active'); }
    }

    function cambiaDitta() {
        let n = prompt("Nome della ditta:");
        if(n) document.getElementById('nomeDitta').innerText = n.toUpperCase();
    }

    // SALVATAGGIO UNIFICATO
    async function salvaTutto() {
        const cNome = document.getElementById('c-nome').value;
        const cStato = document.getElementById('c-stato').value;
        const cDoc = document.getElementById('c-doc').value;
        const oNome = document.getElementById('o-nome').value;
        const oOre = document.getElementById('o-ore').value;
        const oNote = document.getElementById('o-note').value;
        const oMese = document.getElementById('o-mese').value;

        if(!cNome || !oNome || !oOre) { alert("Inserisci almeno: Cantiere, Operaio e Ore!"); return; }

        // Salviamo il record unico che contiene sia dati cantiere che dati operaio
        await db.collection("registri_completi").add({
            cantiere: cNome, stato: cStato, documento: cDoc,
            operaio: oNome, ore: parseFloat(oOre), note: oNote, mese: oMese,
            data: new Date()
        });
        
        alert("Dati salvati con successo!");
        document.getElementById('o-ore').value = "";
        document.getElementById('o-note').value = "";
    }

    // LISTA CANTIERI (Vedi chi ha lavorato e quando)
    db.collection("registri_completi").orderBy("data", "desc").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            let d = doc.data();
            html += `<div class="card">
                <button class="btn-delete" onclick="elimina('${doc.id}')">🗑️</button>
                <div class="info-riga"><span class="semaforo ${d.stato}"></span><strong>${d.cantiere}</strong></div>
                <div class="info-riga">👤 Operaio: <b>${d.operaio}</b> | ⏱️ Ore: <b>${d.ore}</b></div>
                <div class="info-riga">📝 Note: ${d.note}</div>
                ${d.documento ? `<a href="${d.documento}" target="_blank" style="color:var(--azzurro); font-size:12px;">📄 Documenti/Foto</a>` : ''}
                <div style="font-size:9px; color:gray; margin-top:5px;">Mese: ${d.mese}</div>
            </div>`;
        });
        document.getElementById('lista-cantieri').innerHTML = html;
    });

    function elimina(id) {
        if(confirm("Eliminare questo record?")) db.collection("registri_completi").doc(id).delete();
    }

    // EXCEL PER BUSTE PAGA
    async function scaricaExcel() {
        const mese = document.getElementById('filtro-mese').value;
        const snap = await db.collection("registri_completi").where("mese", "==", mese).get();
        let datiExcel = [];
        
        snap.forEach(doc => {
            let d = doc.data();
            datiExcel.push({
                OPERAIO: d.operaio,
                CANTIERE: d.cantiere,
                ORE: d.ore,
                NOTE: d.note,
                MESE: d.mese
            });
        });

        if(datiExcel.length === 0) { alert("Nessun dato per questo mese!"); return; }

        const ws = XLSX.utils.json_to_sheet(datiExcel);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Buste Paga");
        XLSX.writeFile(wb, `Report_Operai_${mese}.xlsx`);
    }
</script>
</body>
</html>
