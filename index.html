<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Cantiere Completa</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; }
        header { background: #1a1a1a; color: #ffcc00; padding: 20px; text-align: center; border-bottom: 4px solid #ffcc00; }
        .edit-ditta { font-size: 12px; color: #aaa; cursor: pointer; text-decoration: underline; }
        
        .nav { display: flex; background: #333; }
        .nav button { flex: 1; padding: 15px; border: none; background: #333; color: white; font-weight: bold; cursor: pointer; }
        .nav button.active { background: #ffcc00; color: #1a1a1a; }

        .container { padding: 15px; max-width: 800px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }

        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; border-left: 5px solid #ffcc00; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        
        .btn-main { background: #ffcc00; color: #1a1a1a; font-weight: bold; border: none; padding: 15px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; }
        .btn-excel { background: #28a745; color: white; margin-top: 20px; }
        
        /* IL CESTINO */
        .trash-btn { position: absolute; top: 10px; right: 10px; background: #ff4444; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }
        
        .file-link { display: inline-block; margin-top: 10px; color: #007bff; font-weight: bold; }
        .info-riga { margin: 5px 0; font-size: 15px; }
        .label { font-weight: bold; color: #666; }
    </style>
</head>
<body>

<header>
    <h1 id="nomeDitta">LA TUA DITTA</h1>
    <span class="edit-ditta" onclick="cambiaDitta()">Modifica Nome</span>
</header>

<div class="nav">
    <button id="btnTab1" class="active" onclick="showTab('cantieri')">CANTIERI & DOC</button>
    <button id="btnTab2" onclick="showTab('ore')">ORE & NOTE</button>
</div>

<div class="container">
    
    <div id="sec-cantieri" class="section active">
        <div class="card">
            <h3>Nuovo Cantiere / Progetto</h3>
            <input type="text" id="c-nome" placeholder="Nome Cantiere">
            <input type="text" id="c-lavoro" placeholder="Tipo di lavoro">
            <p style="margin: 5px 0; font-size: 12px;">Carica Progetto/Doc (Link o Info):</p>
            <input type="text" id="c-link" placeholder="Link al file o nota documento">
            <button class="btn-main" onclick="addCantiere()">SALVA CANTIERE</button>
        </div>
        <div id="lista-cantieri"></div>
    </div>

    <div id="sec-ore" class="section">
        <div class="card">
            <h3>Registra Ore e Note</h3>
            <input type="text" id="o-operaio" placeholder="Nome Operaio">
            <input type="number" id="o-ore" placeholder="Ore lavorate">
            <textarea id="o-note" placeholder="Note sul lavoro (es. montaggio infissi)"></textarea>
            <input type="month" id="o-mese" value="2024-05">
            <button class="btn-main" onclick="addOre()">REGISTRA ORE</button>
        </div>
        <button class="btn-main btn-excel" onclick="exportExcel()">📥 SCARICA EXCEL DEL MESE</button>
        <div id="lista-ore"></div>
    </div>

</div>

<script>
    // --- CONFIGURAZIONE FIREBASE (METTI LE TUE CHIAVI QUI) ---
    const firebaseConfig = {
        apiKey: "TUA_API_KEY",
        authDomain: "TUO_AUTH",
        projectId: "TUO_ID",
        storageBucket: "TUO_BUCKET",
        messagingSenderId: "TUO_SENDER",
        appId: "TUO_APPID"
    };
    // -------------------------------------------------------

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cambia Tab
    function showTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        if(tab === 'cantieri') {
            document.getElementById('sec-cantieri').classList.add('active');
            document.getElementById('btnTab1').classList.add('active');
        } else {
            document.getElementById('sec-ore').classList.add('active');
            document.getElementById('btnTab2').classList.add('active');
        }
    }

    function cambiaDitta() {
        let n = prompt("Nome della tua ditta:");
        if(n) document.getElementById('nomeDitta').innerText = n.toUpperCase();
    }

    // AGGIUNGI CANTIERE
    function addCantiere() {
        const nome = document.getElementById('c-nome').value;
        const lavoro = document.getElementById('c-lavoro').value;
        const link = document.getElementById('c-link').value;
        if(nome) {
            db.collection("cantieri").add({ nome, lavoro, link, data: new Date() });
            document.getElementById('c-nome').value = '';
        }
    }

    // AGGIUNGI ORE
    function addOre() {
        const operaio = document.getElementById('o-operaio').value;
        const ore = document.getElementById('o-ore').value;
        const note = document.getElementById('o-note').value;
        const mese = document.getElementById('o-mese').value;
        if(operaio && ore) {
            db.collection("ore").add({ operaio, ore, note, mese, data: new Date() });
            alert("Registrato!");
        }
    }

    // CARICAMENTO REAL-TIME CANTIERI
    db.collection("cantieri").orderBy("data", "desc").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            let d = doc.data();
            html += `<div class="card">
                <button class="trash-btn" onclick="elimina('${doc.id}', 'cantieri')">🗑️</button>
                <strong>${d.nome}</strong><br>
                <div class="info-riga">${d.lavoro}</div>
                ${d.link ? `<a href="${d.link}" class="file-link" target="_blank">📄 Vedi Documento</a>` : ''}
            </div>`;
        });
        document.getElementById('lista-cantieri').innerHTML = html;
    });

    // CARICAMENTO REAL-TIME ORE
    db.collection("ore").orderBy("data", "desc").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            let d = doc.data();
            html += `<div class="card">
                <button class="trash-btn" onclick="elimina('${doc.id}', 'ore')">🗑️</button>
                <div class="info-riga"><span class="label">Operaio:</span> ${d.operaio}</div>
                <div class="info-riga"><span class="label">Ore:</span> ${d.ore}</div>
                <div class="info-riga"><span class="label">Note:</span> ${d.note}</div>
                <div style="font-size:10px; color:#999">${d.mese}</div>
            </div>`;
        });
        document.getElementById('lista-ore').innerHTML = html;
    });

    // ELIMINA RECORD
    function elimina(id, col) {
        if(confirm("Vuoi eliminare definitivamente questo record?")) {
            db.collection(col).doc(id).delete();
        }
    }

    // ESPORTA EXCEL
    async function exportExcel() {
        const meseScelto = document.getElementById('o-mese').value;
        const snap = await db.collection("ore").where("mese", "==", meseScelto).get();
        let dati = [];
        snap.forEach(doc => {
            let d = doc.data();
            dati.push({ Operaio: d.operaio, Ore: d.ore, Note: d.note, Mese: d.mese });
        });
        
        if(dati.length === 0) { alert("Nessun dato per questo mese"); return; }
        
        const ws = XLSX.utils.json_to_sheet(dati);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Ore Mese");
        XLSX.writeFile(wb, `Report_Cantiere_${meseScelto}.xlsx`);
    }
</script>

</body>
</html>
