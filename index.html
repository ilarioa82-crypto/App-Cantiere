<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Cantiere</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; padding: 20px; }
        h1 { color: #ffcc00; text-align: center; }
        .sezione { background: #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffcc00; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ffcc00; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .scheda-cantiere { background: #444; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ffcc00; position: relative; }
        .riga-dati { margin-bottom: 5px; font-size: 16px; }
        .label { color: #ffcc00; font-weight: bold; }
        
        /* NUOVI TASTI CESTINO E MODIFICA */
        .area-tasti { display: flex; gap: 10px; margin-top: 10px; }
        .btn-elimina { background: #ff4444; color: white; padding: 8px; font-size: 14px; width: 48%; }
        .btn-modifica { background: #4488ff; color: white; padding: 8px; font-size: 14px; width: 48%; }
    </style>
</head>
<body>

    <h1>🏗️ REGISTRO CANTIERE</h1>

    <div class="sezione">
        <h3>Aggiungi Nuovo Rapporto</h3>
        <input type="text" id="cantiere" placeholder="Nome Cantiere">
        <input type="text" id="operaio" placeholder="Nome Operaio">
        <input type="number" id="ore" placeholder="Ore Lavorate">
        <input type="text" id="note" placeholder="Note / Lavoro svolto">
        <button onclick="salvaDato()">INVIA DATI 🚀</button>
    </div>

    <div id="contenitore-dati">
        <p style="text-align:center">Caricamento in corso...</p>
    </div>

    <script>
        // --- QUI METTI LE TUE CHIAVI FIREBASE ---
        var firebaseConfig = {
            apiKey: "IL_TUO_API_KEY",
            authDomain: "IL_TUO_PROGETTO.firebaseapp.com",
            projectId: "IL_TUO_PROGETTO_ID",
            storageBucket: "IL_TUO_PROGETTO.appspot.com",
            messagingSenderId: "IL_TUO_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };
        // ---------------------------------------

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // LEGGI I DATI
        db.collection("rapporti").onSnapshot((snapshot) => {
            var contenitore = document.getElementById("contenitore-dati");
            contenitore.innerHTML = "";
            snapshot.forEach((doc) => {
                var d = doc.data();
                var id = doc.id;
                contenitore.innerHTML += `
                    <div class="scheda-cantiere">
                        <div class="riga-dati"><span class="label">Cantiere:</span> ${d.cantiere}</div>
                        <div class="riga-dati"><span class="label">Operaio:</span> ${d.operaio}</div>
                        <div class="riga-dati"><span class="label">Ore:</span> ${d.ore}</div>
                        <div class="riga-dati"><span class="label">Note:</span> ${d.note}</div>
                        
                        <div class="area-tasti">
                            <button class="btn-modifica" onclick="modificaDato('${id}', '${d.cantiere}', '${d.ore}')">✏️ Modifica</button>
                            <button class="btn-elimina" onclick="eliminaDato('${id}')">🗑️ Elimina</button>
                        </div>
                    </div>
                `;
            });
        });

        // SALVA I DATI
        function salvaDato() {
            var c = document.getElementById("cantiere").value;
            var o = document.getElementById("operaio").value;
            var h = document.getElementById("ore").value;
            var n = document.getElementById("note").value;

            if(c && o && h) {
                db.collection("rapporti").add({
                    cantiere: c,
                    operaio: o,
                    ore: h,
                    note: n,
                    data: new Date().getTime()
                });
                document.getElementById("cantiere").value = "";
                document.getElementById("note").value = "";
                alert("Salvato correttamente!");
            } else {
                alert("Riempi tutti i campi!");
            }
        }

        // FUNZIONE ELIMINA (CESTINO)
        function eliminaDato(id) {
            if(confirm("Vuoi cancellare questo rapporto definitivamente?")) {
                db.collection("rapporti").doc(id).delete();
            }
        }

        // FUNZIONE MODIFICA
        function modificaDato(id, vecchioCantiere, vecchieOre) {
            var nuovoCantiere = prompt("Cambia nome cantiere:", vecchioCantiere);
            var nuoveOre = prompt("Cambia ore:", vecchieOre);
            
            if(nuovoCantiere != null && nuoveOre != null) {
                db.collection("rapporti").doc(id).update({
                    cantiere: nuovoCantiere,
                    ore: nuoveOre
                });
            }
        }
    </script>
</body>
</html>
